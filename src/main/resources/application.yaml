spring:
  application:
    name: ilp
  datasource:
    url: ${ILP_DB_URL}
    username: ilp_app
    password: ${ILP_APP_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ilp_owner
    password: ${LIQUIBASE_COMMAND_PASSWORD}
    contexts: "!test"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
springdoc:
  default-produces-media-type: application/json
logging:
  pattern:
    correlation: "[%X{http.request.id:-}] "
management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: json-logs
  main:
    banner-mode: "off"
logging:
  structured:
    format:
      console: ecs
---
spring:
  config:
    activate:
      on-profile: local
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
