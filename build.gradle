import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.InventoryHtmlReportRenderer
import com.github.jk1.license.render.XmlReportRenderer

plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
	id 'com.github.jk1.dependency-license-report' version '3.1.5'
}

group = 'io.github.samitovaekaterina'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

springBoot {
	buildInfo()
}

spotless {
	java {
		palantirJavaFormat()
	}
}

jacoco {
	toolVersion = '0.8.15'
}

licenseReport {
	configurations = ['runtimeClasspath']
	filters = [new LicenseBundleNormalizer()]
	renderers = [
		new InventoryHtmlReportRenderer('index.html', 'ILP back end: licences of the libraries'),
		new XmlReportRenderer('licences.xml', 'ILP back end: licences of the libraries')
	]
	allowedLicensesFile = layout.projectDirectory.file('config/allowed-licenses.json')
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'com.tngtech.archunit:archunit:1.5.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	testLogging {
		// Every test with its result goes to the build log: a run is readable without opening the report.
		events 'passed', 'skipped', 'failed'
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

tasks.register('integrationTest', Test) {
	description = 'Runs the tests that need a real PostgreSQL in a container.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
	testLogging {
		// On GitHub the application log of these tests is printed to the run log.
		showStandardStreams = System.getenv('CI') != null
	}
}

def coverageData = fileTree(layout.buildDirectory.dir('jacoco')) {
	include '*.exec'
}
def coverageClasses = sourceSets.main.output.classesDirs.asFileTree.matching {
	// Not counted: the start class and the configuration classes hold no logic to test.
	exclude '**/IlpApplication.class', '**/*Config.class', '**/*Configuration.class'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test'), tasks.named('integrationTest')
	executionData.setFrom(coverageData)
	classDirectories.setFrom(coverageClasses)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test'), tasks.named('integrationTest')
	executionData.setFrom(coverageData)
	classDirectories.setFrom(coverageClasses)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest'), tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification'), tasks.named('checkLicense')
}
